[project]
name = "pqkb"
version = "0.1.0"
description = "Builds the Power Query connector archive and its OKF knowledge bundle."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
pqkb = "pqkb.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/pqkb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]

[tool.ruff]
line-length = 100
src = ["tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
extraPaths = ["tools"]
