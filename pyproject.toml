[project]
name = "pqkb"
version = "0.1.0"
description = "Builds the Power Query connector archive and its OKF knowledge bundle."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
pqkb = "pqkb.cli:main"

[dependency-groups]
dev = [
    "okflint==0.5.0",
    "pytest>=8",
    "ruff>=0.6",
]
site = [
    "mkdocs-material>=9.7.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pqkb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
cache-dir = ".cache/ruff"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
extraPaths = ["src"]
