site_name: Power Query Connector Source Reference
site_url: https://back1ply.github.io/powerbi-custom-connectors-source-code/
repo_url: https://github.com/back1ply/powerbi-custom-connectors-source-code
docs_dir: build/knowledge
site_dir: build/site
theme:
  name: material
  features:
  - navigation.indexes
  - navigation.tracking
  - toc.follow
  - content.code.copy
plugins:
- search
markdown_extensions:
- tables
- footnotes
- pymdownx.highlight:
    use_pygments: false
- pymdownx.superfences
extra_javascript:
- https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-core.min.js
- https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-powerquery.min.js
- https://cdn.jsdelivr.net/npm/prismjs@1.30.0/plugins/line-numbers/prism-line-numbers.min.js
- https://cdn.jsdelivr.net/npm/prismjs@1.30.0/plugins/line-highlight/prism-line-highlight.min.js
- assets/source-lines.js
extra_css:
- https://cdn.jsdelivr.net/npm/prismjs@1.30.0/themes/prism.min.css
- https://cdn.jsdelivr.net/npm/prismjs@1.30.0/plugins/line-numbers/prism-line-numbers.min.css
- https://cdn.jsdelivr.net/npm/prismjs@1.30.0/plugins/line-highlight/prism-line-highlight.min.css
- assets/source-lines.css
hooks:
- src/pqkb/site_hooks.py
