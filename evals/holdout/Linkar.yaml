notes: |
  CredentialConnectionString (156) is built but never passed to the provider; ConnectionString (145-153) has no
  UID/PWD, so the engine's UsernamePassword credential handling is all that applies.
  When FileName is given, LinkarImpl returns one table from ExecuteQuery (161, 193-204): a user-written
  select/dict/sort command. Like a user query option, this path is not counted as navigation or folding.
  FullDatabase's sqlmode parameter is unused.
