    sub: {}
  writes:
    values:
    - none
    evidence:
    - file: AptixInsights.pq
      lines: 37-52
      function: AptixInsightsImpl
      note: Read-only OData.Feed; no actions or Table.View mutation handlers
notes: '- Line 49 `url = ValidateUrlScheme(url)` inside the let shadows the function parameter `url` and
  refers to itself, which in M is a cyclic reference; as written this likely errors at evaluation. Labels
  describe the intended behaviour (https check + OData.Feed).

  - `query` is typed `any` but is used as OData.Feed''s Query option (a record of query-string parameters);
  labelled `other` under user-inputs rather than options-record because it is not a connector options
  record.

  - windowWidth / windowHeight (lines 5-6) are defined but never used (leftover OAuth template values).

  - Navigation, paging and folding are entirely delegated to OData.Feed; data format json assumes standard
  OData v4 JSON.

  - schema = driver-provided is a judgement call: types come from the OData service $metadata through
  OData.Feed; the connector itself declares or converts nothing (alternative would be `none`).

  - Strings (.resx) and icon .png files are referenced but not present in the repo folder.

  '
