      - {file: PlanviewOKR.m, lines: "171-175", function: PlanviewOKR.ContentsInternal, note: "no polling"}
    sub: {}
  writes:
    values: [none]
    evidence:
      - {file: PlanviewOKR.m, lines: "1-191", function: PlanviewOKR, note: "read-only"}
notes: |
  GetNextLink (149-157) parses a Link header but is never called: dead code, so paging stays none.
  PKCE sends code_challenge without code_challenge_method; the challenge is an S256 hash, so the server
  must assume S256 for the flow to work. Still counted as PKCE.
