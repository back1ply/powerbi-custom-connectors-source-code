      - {file: PlanviewOKR.m, lines: "171-175", function: PlanviewOKR.ContentsInternal, note: "returns OData.Feed on the user's URL, which builds the navigator from the service document"}
  test-connection:
    values: [reuses-entry-function]
    evidence:
      - {file: PlanviewOKR.m, lines: "12", function: PlanviewOKR, note: "TestConnection = {\"PlanviewOKR.Contents\", resource}"}
  folding:
    values: [odata-folding]
    evidence:
      - {file: PlanviewOKR.m, lines: "173", function: PlanviewOKR.ContentsInternal, note: "folding delegated to OData.Feed"}
    sub: {}
  packaging:
    values: [single-file, localized-strings, icons, beta-flag]
