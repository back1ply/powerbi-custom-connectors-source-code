connector: PlanviewOKR
labelled_by: claude-code/claude-opus-5-5
source_note: PlanviewOKR.m (191 lines); labelled blind, before any model profiled this connector
answers:
  auth:
    values: [oauth]
    evidence:
      - {file: PlanviewOKR.m, lines: "13", function: PlanviewOKR, note: "Authentication = [OAuth = [StartLogin, FinishLogin, Refresh]]"}
    sub:
      oauth-pkce:
        values: ["yes"]
        evidence:
          - {file: PlanviewOKR.m, lines: "83-98", function: StartLogin, note: "code_verifier generated; code_challenge = base64url(SHA256(verifier)) sent to authorize (no code_challenge_method parameter)"}
          - {file: PlanviewOKR.m, lines: "110-114", function: FinishLogin, note: "verifier passed to TokenMethod as code_verifier (line 65)"}
      oauth-refresh:
        values: ["yes"]
        evidence:
          - {file: PlanviewOKR.m, lines: "116-132", function: Refresh, note: "grant_type = refresh_token against /io/v1/oauth2/token"}
  transport:
    values: [odata-feed]
    evidence:
      - {file: PlanviewOKR.m, lines: "171-175", function: PlanviewOKR.ContentsInternal, note: "OData.Feed(ValidateUrlScheme(OdataUrl)); Web.Contents is used only for the OAuth token calls"}
    sub: {}
  user-inputs:
    values: [url-or-server]
    evidence:
      - {file: PlanviewOKR.m, lines: "177-183", function: PlanviewOKR.ContentsType, note: "single required ODataURL (text), must be https"}
    sub: {}
  paging:
    values: [none]
    evidence:
      - {file: PlanviewOKR.m, lines: "171-175", function: PlanviewOKR.ContentsInternal, note: "single OData.Feed call; any nextLink following happens inside OData.Feed"}
    sub: {}
  data-formats:
    values: [json]
    evidence:
      - {file: PlanviewOKR.m, lines: "173", function: PlanviewOKR.ContentsInternal, note: "OData JSON payloads parsed by OData.Feed"}
  schema:
    values: [driver-provided]
    evidence:
      - {file: PlanviewOKR.m, lines: "173", function: PlanviewOKR.ContentsInternal, note: "names and types from the service $metadata via OData.Feed; no schema code"}
    sub: {}
  http-errors:
    values: [default]
    evidence:
      - {file: PlanviewOKR.m, lines: "173", function: PlanviewOKR.ContentsInternal, note: "the only data request, OData.Feed, has no ManualStatusHandling; token calls (60-67, 121-128) are excluded"}
    sub: {}
  documentation:
    values: [function-documentation, parameter-captions]
    evidence:
      - {file: PlanviewOKR.m, lines: "5", function: PlanviewOKR.Contents, note: "Value.ReplaceType(ContentsInternal, ContentsType)"}
      - {file: PlanviewOKR.m, lines: "185-191", function: PlanviewOKR.ContentsType, note: "Documentation.Description, DisplayName, Caption, Name, LongDescription"}
      - {file: PlanviewOKR.m, lines: "179-182", function: PlanviewOKR.ContentsType, note: "FieldCaption on ODataURL; SampleValues = {} is empty, so not counted"}
  navigation:
