notes: '- BuildOdbcConfig (lines 380-459) merges records incorrectly (sample-template bug): e.g. withTop
  does `withEscape[SqlCapabilities] & [SqlCapabilities = [...]]` then `withEscape & caps`, so the StringLiteralEscapeCharacters
  setting ends up as a stray top-level field and the final SqlCapabilities is effectively [SupportsTop
  = false] (+ FractionalSecondsScale = 3).

  - BuildOdbcConfig computes SQLGetFunctions (SQL_CONVERT_FUNCTIONS = CAST from Config_UseCastInsteadOfConvert)
  but SQLGetFunctions is never passed to Odbc.DataSource (lines 315-334), so it is dead.

  - Config_DefaultUsernamePasswordHandling (line 53) is defined but never read; credentials are always
  set explicitly.

  - Diagnostics.pqm functions other than LogValue are unused; tracing is off (EnableTraceOutput = false),
  labelled tracing-gated.

  - AstVisitor LimitClause was counted under odbc-sql-capabilities (it is part of the ODBC folding config),
  not as a custom SQL generator.

  - Port is part of the server address, so user-inputs is only url-or-server.

  - SupportsDirectQuery = Config_EnableDirectQuery = true (line 368).

  '
