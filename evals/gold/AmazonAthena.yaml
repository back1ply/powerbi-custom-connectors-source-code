notes: |
  - AAD credentials surface as AuthenticationKind "OAuth"; the AAD access token is forwarded to the Simba driver as a JWT web identity token (lines 57-66), and role is required in that case.
  - Implicit auth labelled `anonymous` (no credential fields; the driver uses the DSN configuration).
  - AmazonAthena.UI declares NativeQueryProperties with DefaultOptions EnableFolding = true (lines 256-273), but Odbc.DataSource sets HideNativeQuery = true (line 130); native-query not counted.
  - The user `options` parameter is accepted but empty and unused (options-record listed only because the entry function accepts one). redirect_uri (line 14) is defined but never used. ParseResourcePath/ParseResourcePathTC are duplicates.
  - DSN labelled url-or-server (judgement call): the user supplies an ODBC DSN name rather than a host/URL, but it is the connection-target identifier and no better id fits. role is labelled `other`.
  - native-query not counted: patterns/odbc.md also treats Athena's HideNativeQuery = true as native SQL disabled.
  - OdbcConstants.pqm is a constants record plus the Flags helper (lines 3-12, List.Generate bit-OR).
