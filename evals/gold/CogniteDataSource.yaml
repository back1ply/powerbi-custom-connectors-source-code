notes: '- v2 changes: schema gained driver-provided for the OData.Feed nodes (GetODataFeedImpl 544-546),
  per the v2 delegation rule; folding already counted odata-folding on that path. Added the documentation
  answer from CogniteDataSource.Contents. The nav-table functions (GraphQL, PostCDF, GetCDF, GetODataFeed,
  GetDataModelODataFeed) also carry FieldDescription/SampleValues/Name, but they are not shared and add
  no new ids.

  - user-inputs: both shared-entry parameters, project and organization, are identifiers of the
  CDF tenant/project. Organization also resolves the cluster API URL indirectly through auth.cognite.com/api/v1/orgs/{org}/projects,
  so region-or-environment is arguable for it. I labelled it database-or-resource-id, since the user gives
  a tenant name, not a region or URL. The nav-table function items take their own parameters: GraphQL(space,
  datamodel, version, query, optional variables), PostCDF(url, body), GetCDF(url), GetODataFeed(url, optional
  apiVersion) and GetDataModelODataFeed(space, datamodel, version, optional apiVersion). These are not
  entry-function inputs.

  - Navigation: the connector''s own nav table is fixed. The ODataCDF/ODataDataModel feeds return the
  OData service''s navigation from $metadata. GetODataFeedImpl replaces the service''s TimeseriesAggregate
  function with a wrapper that partitions tags (TimeseriesAggregate, PartitionTags). Value.ToText.pqm
  is used only to build that row''s Signature.

  - OData schema and folding are handled by the engine (OData.Feed). The token request (TokenMethod) and
  OData.Feed calls get default status handling. The REST/GraphQL requests that matter use ManualStatusHandling
  and retries.

  - PostCDF can POST to any CDF API path, so a user could hit write endpoints. The connector does not
  offer that as a feature, so writes = none.

  - Unused locals: TokenMethod''s RefreshToken binding (148) is computed but never merged into Parts,
  and hasCDFAccess''s projectItem (1182) is unused. StartLogin and FinishLogin compute urls, which triggers
  the org lookup during login.

  - GraphQL paging is enabled only when the query text contains "$cursor"; otherwise a single page is
  fetched.

  - Localized strings and icons are referenced, but the .resx and .png files are not in the repo folder.

  '
