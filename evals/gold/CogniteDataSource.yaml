    sub:
      retry-rule:
        text: 'RetryWithExponentialBackoff retries 429, 502, 503 and 504. It retries 409 only when the
          response header cdf-is-auto-retryable is "true". It retries 408 except on paths ending /models/instances/query.
          Retry budget is 10 (MaxRetries), or 2 for 408 (MaxRetries408). The delay is full jitter: Number.Random()
          * min(base * 2^retryCount, 60000) ms, with base 1000 ms (2000 ms for 408). Each retry adds IsRetry
          = true to bypass the cache. Once retries run out it raises a CogniteAPIError (''Rate limit''/''Request
          timeout''/''Conflict (autoretryable)''/''Gateway error'' exceeded after N retries) with code,
          x-request-id and cluster. There is no Retry-After handling. Separately, GetGraphQLPage retries
          an HTTP 200 response that has both ''errors'' and ''data'' up to 2 times, with jitter delay
          Random * min(2000 * 2^attempt, 60000) ms. GetAllPagesByCursor also waits 200 ms between pages
          for /streams/ URLs to stay under rate limits.'
        evidence:
        - file: CogniteDataSource.pq
          lines: 19-28
          function: CogniteDefaults
          note: MaxRetries 10, BaseRetryDelayMs 1000, MaxRetryDelayMs 60000, MaxRetries408 2, BaseRetryDelayMs408
