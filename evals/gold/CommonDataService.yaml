        values: [other]
        evidence:
          - {file: CommonDataService.pq, lines: "74-89", function: CommonDataService.Database, note: "the only folding handler is OnNativeQuery (no answer id for it)"}
      native-query-enabled:
        text: "The Sql.Database navigation table is wrapped in Table.View with an OnNativeQuery handler. The handler strips DisplayNames from the options. If DisplayNames is null, it calls Value.NativeQuery on the plain Sql.Database table with the remaining options (incl. EnableFolding), so Sql.Database handles native-query folding itself. If DisplayNames is given and EnableFolding is false, it returns the base result with captions added (AdjustTypeForCaptions). If DisplayNames is given and EnableFolding = true, it tries the query through a SqlDatabase.View T-SQL wrapper (NativeQueryOptions EnableFolding, PreserveTypes) that also applies captions, and falls back to the captioned base result. Errors are rethrown via Table.ViewError."
        evidence:
          - {file: CommonDataService.pq, lines: "74-89", function: CommonDataService.Database, note: "OnNativeQuery implementation"}
          - {file: CommonDataService.pq, lines: "298-318", function: ApplyDisplayNamesOption, note: "SqlDatabase.View with NativeQueryOptions"}
          - {file: CommonDataService.pq, lines: "152-153", function: TryCatch, note: "TryCatch wraps the query evaluation"}
          - {file: CommonDataService.pq, lines: "155", function: TableViewError, note: "errors rethrown as Table.ViewError"}
