notes: |
  - Main query folding comes from the engine's built-in Sql.Database (TDS endpoint, T-SQL). No checklist folding id names it directly.
  - native-query and table-view-handlers (OnNativeQuery only, hence sub "other") are the connector's own code.
  - custom-sql-generator was NOT labelled. The connector writes no SQL text of its own. SqlDatabase.View (298-318) is the engine's T-SQL generator configured through options, and it is reached only for native queries that pass DisplayNames together with EnableFolding = true (lines 83-85).
  - MakeIndirectTable (195-203) implements GetExpression/GetType/GetRows for navigation indirection, not folding, so get-expression was not labelled. Its GetRows always errors (LoadDataError).
  - http-errors: the only manual handling is ManualStatusHandling {401} in GetAuthUri, used by Aad.AuthorizationUri. The BAP request uses default handling. Data goes through Sql.Database.
  - Cloud and AAD authority are set by Environment.FeatureSwitch (lines 50, 56), not by the user, so no region-or-environment.
  - The server parameter is optional: null gives the environment list.
  - UnsafeTypeConversions appears in OptionsMap but is never read.
  - EnvironmentListType is a navigation-table type and is not counted as a declared data schema.
  - DSRHandlers (362-380), GetAddress and ParseAddress* handle data source reference round-tripping. GetAddress and GetAddressWithServerName contain `...` (not implemented) branches for invalid navigation.
  - SupportsDirectQuery = true in the UI record (410). No Beta flag.
  - No .resx or .png files exist in the repo. localized-strings and icons are labelled from the code references.
