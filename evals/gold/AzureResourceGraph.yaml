notes: '- resultTruncated logic is inverted relative to its name: options[resultTruncated]? = null ->
  true, so a user who passes resultTruncated = true actually gets full paging. Default (no options) returns
  a single page.

  - In BuildPostContent, skip and top are always null and the local resultTruncated (line 131) evaluates
  a comparison that is never used, so $skip/$top are never sent; only $skipToken (empty string on the
  first page) is added.

  - Retry: only 500 is retried, via Value.WaitFor with count 3 and 2^n second delays. The count check
  drops the third attempt, and the iteration >= 3 error branch is unreachable, so persistent 500s surface
  as an error from accessing a field of null. Errors from 400/500 are raised as plain text, not Error.Record,
  so structured-error-records is not listed.

  - navigation: no Table.ToNavigationTable; the shared function returns the query result directly. Labelled
  single-table (alternative reading: none).

  - The user-supplied KQL query is not a native-query folding mechanism (no Value.NativeQuery / NativeQuery
  handler), so folding = none.

  - The random 1-3 s Function.InvokeAfter before each page is throttling, not a retry.

  - Publish Beta = false, so beta-flag is not listed.

  '
