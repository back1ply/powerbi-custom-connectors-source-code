      retry-rule:
        text: Only HTTP 500 is retried (400 fails immediately; other non-200 codes use engine default
          handling). Value.WaitFor with count = 3 and exponential delay 2^iteration seconds (1s before
          the first attempt, then 2s, then 4s). Because the loop stops when the counter reaches 3, at
          most iterations 0 and 1 produce a used result (the iteration-2 attempt is dropped by the count
          check), and the 'iteration < 3 else IsError' branch is unreachable. If 500 persists, WaitFor
          returns null and GetPage fails on response[IsError]. Separately, every page request is wrapped
          in Function.InvokeAfter with a random 1-3 s delay (throttling, not a retry). No 429/Retry-After
          handling.
        evidence:
        - file: AzureResourceGraph.pq
          lines: 103-106
          function: WaitForResult
          note: status = 500 and iteration < 3 -> null; interval 2^iteration; count 3
        - file: AzureResourceGraph.pq
