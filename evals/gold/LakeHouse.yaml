  long-running:
    values:
    - other
    evidence:
    - file: MDSync.pqm
      lines: 561-571
      function: Submit
      note: 'other: submits a DMS SQL-endpoint metadata-refresh batch (POST lhdatamarts/{id} or public
        refreshMetadata) and then polls it; runs on writes (OnInsertRows -> tableMDSync) and Lakehouse.RefreshSqlMetadata,
        not on data export'
