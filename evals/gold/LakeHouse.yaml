notes: '- Parquet covers Delta tables read through DeltaLake.Table plus explicit Parquet.Document / Parquet.Metadata
  in the fast-copy write path. Items in the Files folder come back as raw binary (no parsing). The connector
  also reads JSON from its own OneLake file cache (GetDataFromCacheTable, LakeHouse.pq 2748-2770), which
  only runs when the MashupFlight_UseFileCache flag is on.

  - Transport "other" = OneLake via AzureStorage.DataLake / DataLakeContents / BlobContents together with
  DeltaLake.Table. Folding to the lakehouse SQL endpoint mostly comes from the built-in Sql.Database connector;
  the connector''s Table.View layers return Value.Expression(Value.Optimize(...)) so that folding passes
  through.

  - v2 changes: folding gained source-function-folding (Sql.Database in Sql.Contents 2945-2954), per the
  v2 delegation rule. long-running polling-rule added (required now that other needs it). The Spark evidence
  note was corrected from 55 to 56 polls: Value.WaitFor runs the producer for iterations 0..count.
  The LockConflict evidence note was reworded from "up to 54 iterations" to "up to 55 resubmits (guard
  iteration > 54)" to match the polling-rule. The pollBatch evidence still says polling continues on 500,
  but the 500 response handler retries and then raises first (see polling-rule). Added
  the documentation answer (function-documentation, parameter-captions). The options fields also carry
  Documentation.DefaultValue, which has no answer id. Documentation.Name set by Function.Atomic (SparkCompute.pqm
  35, DualTable.View.pqm 27, DeltaTableFastCopy.pqm 30) tags internal functions, not shared ones, so it is
  not counted. test-connection stays dedicated-probe: the kind record has no TestConnection field, and
  the gateway test runs the OnTestConnection handler, which calls the separate Sql.TestServerConnection
  probe.

  - Root Handlers GetRowCount returns the constant 5 (LakeHouse.pq 3572). LakehouseView routes GetRowCount
  to that transform, so a row count on the root nav table returns 5 instead of a real count.

  - custom-sql-generator (Spark SQL through SqlView.Generator / SqlGenerator.pqm) is wired. It only takes
  effect when the MashupFlight_UseSparkCompute feature switch is on and options[UseSparkCompute] = true
  (SparkCompute.pqm 466). DeltaTableFastCopy needs options[EnableOptimizedCopyToLakehouse] = true. Partitioned
  refresh needs MashupFlight_EnablePartitionedRefresh.

  - Native query: DualTable.View defines OnNativeQuery as a passthrough, and DeltaTableFastCopy runs an
  internal Value.NativeQuery (sys.databases check). Neither is a user-facing native query, so native-query
  is not counted.

  - long-running: labelled "other", not "async-export-polling", because the submit-then-poll jobs are
  DMS metadata-sync batches and Livy Spark statements on write paths, not data exports. If the scorer
  treats any submit/poll job as async-export-polling, this is the borderline item.

  - writes: Action/ValueAction sequences are also used heavily (versions, Value.Versions publish, cache
  actions). The single answer chosen is table-view-mutations because every write enters through OnInsertRows/OnUpdateRows/OnDeleteRows
  handlers.

  - The Fabric list APIs (/v1/workspaces, /lakehouses, /warehouses, /items) can return continuationToken.
  The connector ignores it and reads only the first response''s value array, so large tenants may be truncated.
  Answered paging = none.

  - Helpers that are defined but never called: GetMissingTable (LakeHouse.pq 1692), GetPlatformVersion
  (68), BaseCacheKeyFormat (88), OneLakeUriFormat (105), PrivateLinkCapacityHeader/PublicApiSystemCallHeader
  (2733-2734), and LakeHouse.pq''s own GetTenantIdFromToken (279; Workspace.PrivateLink.pqm uses its own
  copy). In Utils.pqm, Web.JsonContentsWithCaching and Web.RefreshToken are never called. SparkComputeUtils
  exports Utils[Connector.EvaluateQueryAndActionsForErrors], which does not exist in Utils (lazy, never
  accessed).

  - Utils[RetryHandler](1) is used for the Livy 503s and for SparkComputeUtils statement-status polling,
  but it never retries: Http.Request increments Iteration before the handler runs, so `Iteration < 1`
  is never true. Only the retry sites with count >= 2 are real.

  - Bug: in the RunSparkSqlStatement retry (SparkComputeUtils.pqm 165-171), the recursive call omits apiUrl,
  so the arguments are shifted.

  - Utils.Connector.GenerateErrorRecord switches between GenerateErrorRecord and SurfaceErrorRecord via
  the MashupFlight_LakehouseSurfaceInnerError feature switch.

  - TryFileCreationActions (LakeHouse.pq 1818-1849) treats 409/PathAlreadyExists as success and retries
  PathNotFound up to 3 times with no delay. That is action-level handling, not HTTP retry-with-delay.

