      lines: 465-541
      function: pollBatch
      note: 'Utils[Value.WaitFor] long-poll of batch events: keep polling on 204/500, up to PollingCount
        = 5, delay 1^(i+1)-1 = 0 s; at the limit raises UnableToSyncTable (or returns null when called
        after a lock conflict)'
    - file: MDSync.pqm
      lines: 585-621
      function: LockConflict
      note: On LockConflict, polls the blocking batch then resubmits; if nothing is in progress, waits
        5 s and retries; up to 55 resubmits (guard iteration > 54)
    - file: SparkComputeUtils.pqm
      lines: 179-233
      function: PollStatementForResult
      note: Livy Spark statement polling while state is waiting/running, up to 56 polls (iterations 0-55,
        maxPollCount = 55), delay 1.1^(i+1)-1 s (Spark compute path, feature-gated)
    sub:
      polling-rule:
        text: 'Two polling loops, both built on Utils[Value.WaitFor], which calls the producer for iterations
          0..count and waits delay(i) before each call. (1) MDSync metadata-refresh batch (pollBatch): long-polls
          the batch events URL (legacy /events/Batch?resourceId=...&batchStateChangeOnly=true or the public
          /sqlEndpoints/{id}/__private/events/{batchId}). Interval: Number.Power(PollingDelayMultiplier
          = 1, i+1) - 1 = 0 s, so there is no client-side wait between long polls. Limit: PollingCount
          = 5, i.e. polls at iterations 0-4; at iteration 5 it raises UnableToSyncTable, or returns null
          when the poll was started by a lock conflict. A 204 response means keep polling. 400, 500 and
          503 are retried by the response handler (RetryHandler(4, i*5) with startState Iteration = 1:
          two retries, 10 s and 15 s) and then raise, so the `responseStatus = 500` keep-polling branch
          is never reached. Any other response is terminal. progressState "success" reads the per-table tablesSyncStatus; a
          table with tableSyncState or sqlSyncState "Failure", or a table missing from the batch, raises
          MetadataRefreshErrorWithDetail (unless it came from a lock conflict or the failure is SQL error 225 during
          a feature-gated output-destination sync). Any other progressState raises MetadataRefreshBatchError. There is no client
          wall-clock timeout; the submit body asks DMS for a server-side batch timeout of MaxDMSBatchDuration
          = 210 s. On LockConflict it polls the blocking batch and resubmits, up to 55 resubmits
          (guard iteration > MaxIterationCount - 1 = 54; a lock conflict at iteration 55 raises UnableToSyncTable);
          if nothing is in progress it waits 5 s and resubmits, with the same 55-resubmit limit (NothingInProgressIterationCount
          - 1 = 54), then raises NothingInProgress. (2) Spark/Livy statement (feature-gated Spark compute):
          polls the statement status URL while state is "waiting" or "running". Interval: 1.1^(i+1)-1
          s (0.1 s, 0.21 s, ... growing; about 37 min in total if it never finishes). Limit: maxPollCount
          = 55, so up to 56 polls (iterations 0-55). The `iteration > maxPollCount` branch is never reached,
          so a statement still running after the last poll returns null rather than an error. Any other
          state is terminal; output.status = "error" raises LakehouseSparkStatementExecutionError, and
          [TABLE_OR_VIEW_NOT_FOUND] re-runs the statement once after 15 s.'
        evidence:
        - file: Utils.pqm
          lines: 224-235
          function: Value.WaitFor
          note: List.Generate continues while state{0} <= count + 1; Function.InvokeAfter(() => producer(i),
            delay(i))
        - file: MDSync.pqm
          lines: '30'
          function: MetadataSyncConfig
          note: MaxIterationCount = 55, PollingCount = 5, NothingInProgressIterationCount = 55, PollingDelayMultiplier
            = 1
        - file: MDSync.pqm
          lines: 494-498
          function: pollBatch
          note: continuePolling when Response.Status is 204 (or 500, but see the next citation)
        - file: MDSync.pqm
          lines: 661-669
          function: MetadataRefreshResponseHandlers
          note: 400 (retryOn400 = true while polling), 500, 503 -> Utils[RetryHandler](4, iteration*5);
            RetryHandler falls through to DefaultErrorHandler, which raises (Utils.pqm 404-408, 398)
        - file: MDSync.pqm
          lines: 509-539
          function: pollBatch
          note: iteration >= pollCount -> UnableToSyncTable (or null after a lock conflict); HasError ->
            error; delay Number.Power(multiplier, iteration + 1) - 1
        - file: MDSync.pqm
          lines: 348-366
          function: getResultStatus
          note: progressState "success" -> per-table status; any other state -> MetadataRefreshBatchError
        - file: MDSync.pqm
          lines: 459-461
          function: getResultStatus
          note: table failure raises MetadataRefreshErrorWithDetail unless lock conflict or all ignorable
        - file: MDSync.pqm
          lines: '26'
          function: MaxDMSBatchDuration
          note: MaxDMSBatchDuration = 210, sent as the batch timeout at lines 233 and 295
        - file: MDSync.pqm
          lines: 585-621
          function: LockConflict
          note: resubmit loop guarded by MaxIterationCount - 1; nothing-in-progress waits #duration(0,0,0,5)
        - file: SparkComputeUtils.pqm
          lines: 152-172
          function: RunSparkSqlStatement
          note: maxPollCount = 55; RetryOperation re-runs once after #duration(0,0,0,15)
        - file: SparkComputeUtils.pqm
          lines: 191-231
          function: PollStatementForResult
          note: continuePolling on waiting/running; output.status "error" raises; delay 1.1^(iteration+1)-1
