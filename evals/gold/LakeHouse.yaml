    sub:
      retry-rule:
        text: 'Utils.Http.Request increments Iteration before the handler runs, and RetryHandler(count,
          delay) retries while Iteration < count, waiting delay(Iteration) (default Iteration*0.2 s).
          Lakehouse listing (/v1/workspaces/{id}/lakehouses, no startState): 503 RetryHandler(5) = 4 retries
          at 0.2, 0.4, 0.6, 0.8 s. MDSync DMS calls (startState Iteration=1): 500/503, and 400 only when
          polling batch events, use RetryHandler(4, i*5) = 2 retries at 10 s and 15 s. MDSync LockConflict:
          polls the blocking batch and resubmits; if no batch is in progress it waits 5 s and resubmits,
          up to about 55 iterations. Livy (Spark compute, feature-gated): statement submit 409 RetryHandler(3,
          i+5) with startState Iteration=1 = 1 retry after 7 s. The RetryHandler(1) on session list/create/state
          and statement-status 503 never retries (1<1 / 2<1 is false). A session state that is not idle
          is re-requested about 5 times, at 4, 8, 12, 16, 20 s (JsonRetryHandler(10) adds its own increment).
          A failed statement with [TABLE_OR_VIEW_NOT_FOUND] is re-run once after 15 s. DeltaTableFastCopy
          OneLake listing: 404/503 retried up to 14 times, 5 s apart. 401/403 trigger one forced token
          refresh and then error. Nothing handles 429 or Retry-After.'
        evidence:
        - file: Utils.pqm
          lines: 404-408
          function: RetryHandler
          note: delay = delayFunction ?? ((i) => i * 0.2); Function.InvokeAfter while state[Iteration]
            < count
        - file: LakeHouse.pq
          lines: 335-340
          function: GetLakehousePublicAPIWitoutData
          note: maxRetryCount = 5; [503 = Utils[RetryHandler](maxRetryCount)]
        - file: MDSync.pqm
          lines: 661-669
          function: MetadataRefreshResponseHandlers
          note: metadataDelayFn = iteration * 5; 400 (poll only), 500, 503 -> RetryHandler(4, ...)
        - file: SparkComputeUtils.pqm
          lines: 138-143
          function: RunSparkSqlStatement
          note: '[409 = Utils[RetryHandler](3, ((i) => i+1 * 5))]'
        - file: SparkComputeUtils.pqm
          lines: 159-172
          function: RunSparkSqlStatement
          note: 'RetryOperation (TABLE_OR_VIEW_NOT_FOUND) re-run after #duration(0,0,0,15)'
        - file: SparkComputeUtils.pqm
          lines: 260-278
          function: JsonRetryHandler
          note: Re-polls Livy session state when it is not idle, delay (i+1)*2 s, up to 10 times
        - file: DeltaTableFastCopy.pqm
