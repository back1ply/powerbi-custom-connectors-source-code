    sub:
      retry-rule:
        text: 'Retries HTTP 500 and 502 only (ManualStatusHandling list). Up to 2 retries (3 attempts
          total; retry while attempt < 2). Delay is linear: 1s before the 1st retry, 2s before the 2nd,
          via Function.InvokeAfter. After the last failure it raises Error.Record HttpRequestFailed with
          the status. Other statuses (incl. 429) use default engine handling.'
