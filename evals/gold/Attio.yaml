notes: '- Paging is per collection: Objects, Lists, WorkspaceMembers and Self are unpaged (Paging Style
  "none", lines 328, 345, 362, 464); Notes, Tasks, Threads, Webhooks use offset/limit; Meetings uses cursor.
  "none" was not added to the paging values.

  - FetchCollection supports a "cursorId" style and HasMoreField/LastRowIdField options (586-593, 607),
  but no collection configures them.

  - The unpaged branch (616-621) adds a limit param only if LimitParam is set; none of the unpaged collections
  set it.

  - The PageSize option (521, default 50) is never overridden.

  - structured-error-records is a judgement call: the only structured error is the Error.Record raised
  after retries are exhausted for 500/502 (492-495); other statuses use default engine handling.

  - TestConnection is labelled dedicated-probe because the entry function branches to a separate TestConnectionProbe
  (one GET v2/objects) rather than building the nav table.

  - The schema is applied only to the declared columns that are present. Extra API fields are not removed
  and missing columns are not added for non-empty pages. Hence inferred-from-data alongside declared-schema.

  - No .resx or .png files exist in the repo for this connector. localized-strings and icons are labelled
  from the Extension.LoadString / Extension.Contents references.

  - NormalizeUrl enforces https; Attio.BasePath is "" so no path templating applies.

  '
