  long-running:
    values:
    - async-export-polling
    evidence:
    - file: Anaplan.pq
      lines: 547-558
      function: DownloadFileChunks
      note: on metadata status 200 calls GetWebContentsExportRunSuccess; forced by the exportRun <> null
        check
    - file: Anaplan.pq
      lines: 618-649
      function: GetWebContentsExportRunSuccess
      note: POST exports/{id}/tasks, then polls tasks/{taskId} until not in progress, then downloads file
        chunks
    sub:
      polling-rule:
        text: After POSTing the export task, it polls GET .../exports/{id}/tasks/{taskId} up to 200 times.
          The first attempt is immediate and later attempts come after Function.InvokeAfter with a 10
          second delay, about 33 minutes max. A NoCache header with a random value defeats caching. It
          is terminal when task.taskState differs from the TaskInProgress resource string (literal value
          in a .resx that is not in the repo). On a terminal state it downloads the file chunks. If all
          attempts stay in progress it returns ErrorTable(2, taskId).
        evidence:
        - file: Anaplan.pq
          lines: 631-645
          function: GetWebContentsExportRunSuccess
          note: 'getTaskStatusLoop(200, #duration(0,0,0,10)); List.Select for taskState <> TaskInProgress;
            List.First'
  writes:
    values:
    - none
    evidence:
    - file: Anaplan.pq
      lines: 618-626
      function: GetWebContentsExportRunSuccess
      note: the only live POST starts an export job (read); no data is written back
notes: '- RunExportAction (478-496): the binding `status` (HasInProgressTasks / PostAction) is never referenced,
  so because of lazy evaluation neither runs. Only DownloadFileChunks runs. The live export POST and polling
  are in GetWebContentsExportRunSuccess. DownloadFileListAccumulate is called twice: once inside the polling
  result (640) and again at 556.

  - Excel: line 583 branches to Excel.Workbook when exportFormat = application/vnd.ms-excel. GetExportsTable
  (445), however, keeps only text/csv and text/plain exports, so the Excel branch is effectively unreachable.
  Excel is therefore left out of data-formats.

  - Chunk download (569-581) lists chunk ids and fetches each one. That is a file download, not result
  paging.

  - The polling loop is labelled long-running, not http-errors retry-with-delay, because it waits for
  job state and does not retry failed requests.

  - Value.WaitFor (777-791) is never called. GetExportTasks (518-542) is commented out, as are RefreshTokenInfo
  and IsValidApiUrl (688-719). Never-used definitions: GetApiTokenValue, Date.CurrentEpoch, ExportsMinId,
  MinExpirationTime, ErrorStatus, logout_uri, scopes, scope_prefix, Base64UrlEncodeWithoutPadding. The
  top-level codeVerifier (41) is shadowed by the local one in StartLogin (57). HasClientError is only
  reached on a branch that cannot trigger, because resp is always a record with models.

  - GetApiToken sends Query=[Authorization="Basic encoded_username:password"], a literal placeholder.
  The real Basic credential is applied by the engine from the UsernamePassword credential.

  - In Refresh, the fallback when tokenHost is missing is TokenHostNotFoundMessage, which is a record,
  not text. That is a bug, but the path is still wired.

  - OAuth uses PKCE with code_challenge_method = plain, not S256.

  - Table.ToNavigationTable is defined inline (754-775), not in a .pqm.

  - Localized strings and icons are referenced, but the .resx and .png files are not in the repo folder.

  '
