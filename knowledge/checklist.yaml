# Per-connector checklist (phase 2). Authored; edit here, not in generated output.
#
# Part 1 (`questions`) describes how a connector works. Questions follow the order
# and names of the Power Query SDK "Concepts" topics on Microsoft Learn; `topic` and
# `docs` link each one to its page. Questions without an SDK topic come last.
# Part 2 (certification rules) is computed by `pqkb certification`; see
# src/pqkb/certification.py.
#
# An answer is picked from `answers` (several allowed when `multi: true`) and must
# cite the function(s) and file lines that implement it. Sub-questions are asked only
# when one of the parent answers listed in `when` was given. `other` needs a short
# description; recurring `other` answers should become new answer ids.
#
# Labelling rules:
# - Count only code that is wired and reachable from the shared entry functions, the
#   data source kind record, or Publish. Note dead helpers; do not count them.
# - Resources (.resx, .png) are stripped from the archive. Infer localized strings
#   and icons from Extension.LoadString and Extension.Contents calls.
# - When behaviour is delegated to the transport (OData.Feed, an ODBC driver,
#   Sql.Database), pick the answer that names the delegation (driver-provided,
#   odata-folding, source-function-folding), not `none`.
# - A TestConnection that calls the entry function with a flag which branches to a
#   separate probe counts as dedicated-probe.
#
# `definitions` (optional, per question) pins down what an answer id means. Each entry
# has `means` and `source`: a Learn page under docs_base whose wording the definition
# follows, `archive:<page>` for the retired certification pages (Wayback snapshots,
# 2024; Microsoft closed new certification in Oct 2025), or `convention` when no
# official page settles the boundary and the rule is this project's own.
version: 2
docs_base: https://learn.microsoft.com/en-us/power-query/
questions:
  - id: auth
    topic: Handling authentication
    docs: handling-authentication
    question: How does the connector authenticate?
    multi: true
    answers: [anonymous, key, username-password, windows, oauth, aad, signed-request, other]
    sub:
      - id: oauth-pkce
        when: [oauth]
        question: Does the OAuth flow use PKCE?
        answers: ["yes", "no"]
      - id: oauth-refresh
        when: [oauth]
        question: Does it implement token refresh?
        answers: ["yes", "no"]
      - id: key-placement
        when: [key]
        question: Where is the key sent?
        multi: true
        answers: [header, query-string, body, other]

  - id: transport
    topic: Handling data access
    docs: handling-data-access
    question: What does it use to reach the data source?
    multi: true
    answers: [web-contents, odata-feed, odbc, adonet-oledb, sql-database, adbc-flight, other]
    sub:
      - id: odbc-capabilities
        when: [odbc]
        question: Does it declare SqlCapabilities or SQLGetInfo overrides?
        answers: ["yes", "no"]

  - id: user-inputs
    topic: Handling resource path
    docs: handling-resource-path
    question: What does the user supply to connect?
    multi: true
    answers: [url-or-server, database-or-resource-id, options-record, region-or-environment, date-range, none, other]
    definitions:
      url-or-server:
        means: A parameter naming the connection target - a URL, host/server name, or an ODBC DSN.
        source: handling-resource-path
      database-or-resource-id:
        means: A parameter naming a database, project, workspace, organization, tenant, or other resource inside the target.
        source: convention
      options-record:
        means: An optional record parameter of connector settings (conventionally `options`). A parameter passed straight through as another function's option, such as an OData Query record, is `other`.
        source: convention
      region-or-environment:
        means: The user picks a region, cloud, or deployment environment by name (for example EU, prod, sandbox). Not a URL, and not an organization or project name even when the connector uses it to look up an endpoint.
        source: convention
      none:
        means: The data source function has no parameters the user must supply.
        source: handling-resource-path
    sub:
      - id: options-fields
        when: [options-record]
        question: Which fields does the options record accept?
        free_text: true

  - id: paging
    topic: Handling paging
    docs: handling-paging
    question: How does it page through results?
    multi: true
    answers: [none, offset-limit, cursor-token, next-link-url, skip-token, graphql-cursor, other]
    sub:
      - id: paging-generator
        when: [offset-limit, cursor-token, next-link-url, skip-token, graphql-cursor, other]
        question: Which construct generates the pages?
        multi: true
        answers: [table-generatebypage, list-generate, recursion, other]
        definitions:
          table-generatebypage:
            means: Pages come from the Table.GenerateByPage helper. Name only this outermost construct; the helper is built on List.Generate, so do not also answer list-generate for it.
            source: helper-functions
          list-generate:
            means: The connector calls List.Generate itself to fetch pages, not through Table.GenerateByPage.
            source: helper-functions
          recursion:
            means: A function calls itself with the next page URL or token and combines the results.
            source: convention
      - id: paging-stop
        when: [offset-limit, cursor-token, next-link-url, skip-token, graphql-cursor, other]
        question: What ends paging?
        free_text: true

  - id: data-formats
    topic: Handling transformations
    docs: handling-transformations
    question: What data formats does it parse?
    multi: true
    answers: [json, csv, xml, parquet, excel, binary-compressed, arrow, driver-rows, other]
    definitions:
      arrow:
        means: Results arrive as Apache Arrow, including Arrow Flight SQL through an ADBC driver, even when the driver decodes it.
        source: convention
      driver-rows:
        means: Rows come from an ODBC, ADO.NET/OLE DB, or Sql.Database driver as tables.
        source: handling-data-access
      excel:
        means: Excel.Workbook is reachable for data the connector actually returns. Like every answer, count it only on a live path.
        source: convention

  - id: schema
    topic: Handling schemas
    docs: handling-schema
    question: How are column names and types set?
    multi: true
    answers: [declared-schema, inferred-from-data, explicit-type-conversion, driver-provided, none]
    definitions:
      declared-schema:
        means: The connector itself assigns M types to the named columns of the data tables it returns - a hardcoded schema table or table type, or its own mapping from source type names to M types. Column names without types do not count, nor do navigation tables or other helper tables the connector builds for itself.
        source: handling-schema
      inferred-from-data:
        means: Column names come from the data itself (record field names, Table.FromRecords, Csv.Document Column1..N) and the connector assigns them no declared M types.
        source: handling-schema
      explicit-type-conversion:
        means: The connector converts column values of returned data to specific types - Table.TransformColumnTypes, Table.ChangeType, or per-value Date.From/Number.From on data cells. Rewriting driver metadata (for example SQLColumns type names) stays driver-provided, and converting values used only internally is not counted.
        source: handling-schema
      driver-provided:
        means: The transport supplies names and types - an ODBC driver, Sql.Database, ADO.NET, or OData.Feed from $metadata - and the connector does not redefine them.
        source: handling-schema
    sub:
      - id: empty-result-columns
        when: [declared-schema]
        question: Does an empty result keep the declared columns?
        answers: ["yes", "no", unclear]

  - id: http-errors
    topic: Handling status codes
    docs: handling-status-codes
    question: How does it handle HTTP status codes and errors?
    multi: true
    applies_when: {transport: [web-contents, odata-feed]}
    answers: [default, manual-status-handling, structured-error-records, retry-with-delay, rate-limit-aware]
    definitions:
      default:
        means: At least one live data request (Web.Contents or OData.Feed, not an OAuth token or auth exchange) leaves status handling to Power Query, with no ManualStatusHandling.
        source: handling-status-codes
      manual-status-handling:
        means: At least one live call, token calls included, sets ManualStatusHandling and inspects the status itself.
        source: handling-status-codes
      structured-error-records:
        means: Errors raised from HTTP responses (status code or error body) are built as Error.Record values. Error records for invalid user input do not count.
        source: handling-status-codes
      retry-with-delay:
        means: A failed request is sent again after a delay (Value.WaitFor, Function.InvokeAfter). Polling a job's status until it finishes is long-running, not retry.
        source: handling-status-codes
    sub:
      - id: retry-rule
        when: [retry-with-delay, rate-limit-aware]
        question: Which statuses are retried, how many times, and with what delay?
        free_text: true

  - id: documentation
    topic: Handling documentation
    docs: handling-documentation
    question: What documentation metadata does it attach to its shared functions?
    multi: true
    answers: [function-documentation, parameter-captions, parameter-descriptions, sample-values, allowed-values, none]

  - id: navigation
    topic: Handling navigation tables
    docs: handling-navigation-tables
    question: How is the navigation table built?
    multi: true
    answers: [single-table, fixed-list, discovered-from-api, hierarchical, none]
    definitions:
      single-table:
        means: The data source function returns one data table directly, with no navigation table.
        source: handling-navigation-tables
      fixed-list:
        means: The navigation table's rows are a hardcoded list, even a single row. A hardcoded folder or action inside an otherwise discovered tree does not count.
        source: handling-navigation-tables
      discovered-from-api:
        means: The navigator's items are listed at runtime from the source. OData.Feed on a service root counts, because it builds the navigator from the service document.
        source: handling-navigation-tables
      hierarchical:
        means: Some navigation rows are folders (IsLeaf false) that open further navigation tables.
        source: handling-navigation-tables
      none:
        means: No shared function returns a table (for example it only returns functions or scalar values).
        source: convention

  - id: test-connection
    topic: Handling gateway support
    docs: handling-gateway-support
    question: How is TestConnection wired for gateway refresh?
    answers: [dedicated-probe, reuses-entry-function, not-defined]

  - id: folding
    topic: Handling native query support; TripPin 10 (Table.View folding)
    docs: native-query-sdk
    question: Does it fold queries to the source, and how?
    multi: true
    answers: [none, table-view-handlers, odbc-sql-capabilities, native-query, custom-sql-generator, odata-folding, source-function-folding]
    definitions:
      table-view-handlers:
        means: The connector writes its own folding handlers in Table.View (OnTake, OnSelectRows, OnSort and the like). A Table.View that adds only GetRows or OnNativeQuery is not folding; OnNativeQuery alone is native-query. Handlers built by the engine's SqlView.Generator count under custom-sql-generator.
        source: samples/trippin/10-tableview1/readme
      native-query:
        means: Value.NativeQuery is supported, through an OnNativeQuery handler or a source function that accepts native queries.
        source: native-query-sdk
      odbc-sql-capabilities:
        means: Folding through Odbc.DataSource, shaped by SqlCapabilities, SQLGetInfo, SQLGetTypeInfo, or AstVisitor overrides. An AstVisitor that rewrites LIMIT/OFFSET belongs here, not under custom-sql-generator.
        source: odbc
      custom-sql-generator:
        means: The connector writes its own SQL text generator outside the ODBC driver, usually behind Table.View handlers.
        source: samples/trippin/10-tableview1/readme
      source-function-folding:
        means: Folding is delegated to a source function that folds on its own, such as Sql.Database.
        source: convention
    sub:
      - id: table-view-handlers
        when: [table-view-handlers]
        question: Which Table.View handlers are implemented?
        multi: true
        answers: [on-take, on-skip, on-select-rows, on-select-columns, on-sort, on-group, on-add-columns, get-row-count, get-expression, other]
      - id: native-query-enabled
        when: [native-query]
        question: How is native query support enabled?
        free_text: true

  - id: packaging
    topic: Versioning; Handling connector signing
    docs: handling-versioning
    question: How is the connector packaged?
    multi: true
    answers: [single-file, pqm-modules, localized-strings, icons, beta-flag]
    definitions:
      beta-flag:
        means: The data source kind or Publish record sets Beta = true. Beta = false or no Beta field is not a beta flag.
        source: handling-data-access
      pqm-modules:
        means: Code is split into .pqm files loaded with Extension.Contents or a LoadFunction/LoadExpression helper.
        source: convention

  - id: diagnostics
    topic: TripPin 8 (Diagnostics)
    docs: samples/trippin/8-diagnostics/readme
    question: Does it emit diagnostics?
    answers: [none, tracing-always, tracing-gated]
    definitions:
      tracing-always:
        means: At least one live Diagnostics.Trace call (directly or through a helper) runs without a switch such as EnableTraceOutput.
        source: samples/trippin/8-diagnostics/readme
      tracing-gated:
        means: Every live Diagnostics.Trace call sits behind a switch such as EnableTraceOutput.
        source: samples/trippin/8-diagnostics/readme
      none:
        means: No live code calls Diagnostics.Trace. Correlation headers sent to the server (traceparent) are not diagnostics.
        source: samples/trippin/8-diagnostics/readme

  - id: long-running
    question: Does it run long-running operations?
    answers: [none, async-export-polling, other]
    sub:
      - id: polling-rule
        when: [async-export-polling, other]
        question: What are the polling interval, timeout, and terminal states?
        free_text: true

  - id: writes
    question: Does it write data back to the source?
    answers: [none, table-view-mutations, actions]
    definitions:
      actions:
        means: The connector changes data in the source through Action functions (insert, update, delete). Starting an export or query job to read data is not a write.
        source: convention
