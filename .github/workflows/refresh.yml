name: Refresh certified connectors

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: certified-connector-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked tooling
        run: |
          python -m pip install uv==0.11.3
          uv sync --locked --group site
      - name: Refresh from Microsoft
        run: uv run pqkb refresh
      - name: Check source excerpts and pipeline
        id: tests
        continue-on-error: true
        run: uv run pytest -q
      - name: Check lint, metadata, and links
        id: static
        continue-on-error: true
        run: |
          uv run ruff check tools tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff format --check tools tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run okflint validate --manifest okf-base.yaml
      - name: Build review preview
        id: site
        continue-on-error: true
        run: uv run --group site mkdocs build --strict
      - name: Scan before publishing a refresh branch
        uses: ./.github/actions/scan-secrets
      - name: Open or update draft refresh PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/certified-connectors
          base: master
          add-paths: |
            connectors/
            knowledge/
          commit-message: Refresh certified connector archive and knowledge
          title: Refresh certified connectors from Microsoft
          draft: always-true
          body: |
            Updates the extracted archive, generated connector pages, pattern match lists, and refresh log.

            Checks run in this refresh workflow:
            - Source excerpts and pipeline: ${{ steps.tests.outcome }}
            - Lint, metadata, and links: ${{ steps.static.outcome }}
            - Site build: ${{ steps.site.outcome }}
            - Secret scan: passed (a failure prevents this PR step)

            Review changed implementations and any stale pattern excerpts before merging. Failed content checks are preserved here for repair; this PR stays a draft.

            This workflow uses GITHUB_TOKEN, so the resulting PR does not automatically trigger the separate pull_request validation workflow. After repairs, dispatch Validate reference on this branch and inspect the result before merging.
