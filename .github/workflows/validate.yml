name: Validate reference

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate when called by refresh automation
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked tooling
        run: |
          python -m pip install uv==0.11.3
          uv sync --locked --group site
      - name: Test and lint
        run: |
          uv run pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff check src tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff format --check src tests
      - name: Check generated bundle and internal links
        run: |
          uv run pqkb build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- knowledge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run okflint validate --manifest okf-base.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run pqkb verify-reviews
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run pqkb verify-matches
      - name: Scan archive and bundle for secrets
        uses: ./.github/actions/scan-secrets
      - name: Build review preview
        run: uv run --group site mkdocs build --strict
      - name: Package portable OKF bundle
        run: Compress-Archive -Path build/knowledge/* -DestinationPath build/site/knowledge.zip -Force
      - name: Upload review preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reference-site-preview
          path: build/site
